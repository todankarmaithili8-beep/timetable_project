name: timetable_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0

  url_launcher: ^6.3.2

  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/gadre_logo.png
    - assets/images/app_icon1.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon1.png"
  min_sdk_android: 21